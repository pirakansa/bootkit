version: 1

vars:
  CODEX_VERSION: "0.144.6"

repositories:
  - _comment: OpenAI Codex CLI (Linux x64)
    url: https://github.com/openai/codex/releases/download/rust-v${{ .vars.CODEX_VERSION }}
    files:
      - file_name: codex-x86_64-unknown-linux-musl.tar.gz
        encoding: tar+gzip
        extract: codex-x86_64-unknown-linux-musl
        rename: codex
        out_dir: $HOME/.local/bin
        mode: "0755"
