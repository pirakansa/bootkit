version: 1

repositories:
  - _comment: OpenAI Codex CLI (Linux x64)
    url: https://github.com/openai/codex/releases/download/rust-v0.106.0/
    files:
      - file_name: codex-x86_64-unknown-linux-musl.tar.gz
        encoding: tar+gzip
        extract: codex-x86_64-unknown-linux-musl
        rename: codex
        out_dir: $HOME/.local/bin
        mode: "0755"
